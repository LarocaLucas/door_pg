name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forçar Atualização de Cache
        run: |
          # Pega a data e hora atual no formato AAAAMMDDHHMMSS
          VERSION=$(date +%Y%m%d%H%M%S)
          echo "Nova versão de cache: $VERSION"
          
          # Procura em todos os HTML e JS e substitui ?v=... pela nova versão
          find . -type f \( -name "*.html" -o -name "*.js" \) -exec sed -i -E "s/\?v=[0-9]+/\?v=$VERSION/g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
